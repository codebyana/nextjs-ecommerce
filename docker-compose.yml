version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: james-boogie-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: james_boogie_db
      MYSQL_USER: james_user
      MYSQL_PASSWORD: james_password
    ports:
      - '3306:3306'
    volumes:
      - james_boogie_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin
    container_name: james-boogie-pma
    restart: always
    ports:
      - '8080:80'
    environment:
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=rootpassword
    depends_on:
      - db

volumes:
  james_boogie_data:
